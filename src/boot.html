<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'self' file:">
<title>scKillboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:900px;height:377px;overflow:hidden;background:#000}
.boot{
  width:900px;height:377px;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  -webkit-app-region:drag;
}
.boot-line{
  font-family:'Segoe UI',sans-serif;
  font-size:11px;
  font-weight:400;
  color:#fff;
  letter-spacing:2.5px;
  text-transform:uppercase;
  text-align:center;
  opacity:0;
  text-shadow:0 0 30px rgba(255,255,255,0.4);
  max-width:600px;
  line-height:1.8;
  transition:none;
}
</style>
</head>
<body>
<div class="boot">
  <div class="boot-line" id="line"></div>
</div>
<audio id="bg-audio" loop style="display:none">
  <source src="../assets/bg_music.m4a" type="audio/mp4">
</audio>
<script>
const LINES = [
  "Welcome back. Ready to jack in?",
  "Another night chasing ghosts between stars?",
  "This system is cold tonight. Perfect hunting weather.",
  "Most pilots quit. You returned.",
  "Drift complete. Consciousness restored.",
  "Initializing neural link\u2026",
  "Boot sequence complete. Welcome back, hunter.",
  "Welcome back. Try not to die this time.",
  "\u2026and Caesar wept, for there were no more worlds to conquer.",
]

const el = document.getElementById('line')
el.textContent = LINES[Math.floor(Math.random() * LINES.length)]

// Background music is owned by the persistent audio window in the main process,
// which now guarantees the intro plays for the first few seconds even if the
// launcher is muted. Playing a second copy here caused an echo, so the boot
// screen no longer starts its own track.
const audio = document.getElementById('bg-audio')
try { audio.pause(); audio.muted = true } catch(e) {}

// Timeline over 6 seconds:
// 0.0s  — start fade in
// 1.5s  — fully visible, hold
// 4.0s  — start fade out
// 6.0s  — fully black, navigate

function animate() {
  // Fade in over 1.5s
  el.style.transition = 'opacity 1.5s ease'
  el.style.opacity    = '1'

  setTimeout(() => {
    // Fade out over 2s
    el.style.transition = 'opacity 2s ease'
    el.style.opacity    = '0'
  }, 3200)

  setTimeout(() => {
    // Tell main process to switch to splash
    try { window.vkb.bootComplete() } catch(e) {}
  }, 6000)
}

// Small delay so black frame renders before starting
setTimeout(animate, 3000)
</script>
</body>
</html>
